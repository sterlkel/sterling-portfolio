<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 02 — Flow field, made yours</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0d10; --fg:#e8e6e3; --muted:#8a8f98; --accent:#ff4f6d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:Inter,system-ui,sans-serif; transition:background .4s,color .4s; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hero { position:relative; z-index:1; height:100vh; display:flex; flex-direction:column; justify-content:center; padding:0 8vw; pointer-events:none; }
  .eyebrow { font-family:"JetBrains Mono",monospace; color:var(--accent); font-size:14px; letter-spacing:.08em; }
  h1 { font-size:clamp(48px,9vw,128px); line-height:.95; margin:.2em 0; font-weight:700; letter-spacing:-.03em; }
  p.sub { font-size:clamp(18px,2vw,24px); color:var(--muted); max-width:36ch; }
  body.hidetext .hero { opacity:0; }
  .panel { position:fixed; z-index:3; right:20px; bottom:20px; width:270px; background:color-mix(in srgb, var(--bg) 80%, transparent); border:1px solid color-mix(in srgb, var(--fg) 15%, transparent); border-radius:14px; padding:14px 16px; backdrop-filter:blur(10px); font-size:13px; }
  .panel h3 { margin:0 0 6px; font:500 11px "JetBrains Mono",monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .panel .group { margin-bottom:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chips button { font:500 12px Inter,sans-serif; color:var(--fg); background:none; border:1px solid color-mix(in srgb, var(--fg) 20%, transparent); padding:5px 10px; border-radius:999px; cursor:pointer; }
  .chips button.on { background:var(--fg); color:var(--bg); }
  label { display:flex; gap:8px; align-items:flex-start; padding:3px 0; cursor:pointer; line-height:1.35; }
  label small { color:var(--muted); display:block; }
  @media (max-width:600px) { .panel { left:16px; right:16px; width:auto; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<section class="hero">
  <div class="eyebrow">// hi, my name is</div>
  <h1>Sterling Kelly.</h1>
  <p class="sub">Full stack engineer, founder, and occasional novelist. I build things and write about it.</p>
</section>

<aside class="panel">
  <div class="group"><h3>Palette</h3>
    <div class="chips" id="pal">
      <button data-p="ember" class="on">Ember</button>
      <button data-p="abyss">Abyss</button>
      <button data-p="spectral">Spectral</button>
      <button data-p="ink">Ink on paper</button>
    </div>
  </div>
  <div class="group"><h3>Cursor behavior</h3>
    <div class="chips" id="cur">
      <button data-c="repel" class="on">Part</button>
      <button data-c="vortex">Vortex</button>
      <button data-c="attract">Gather</button>
    </div>
  </div>
  <div class="group"><h3>Borrowed from A & B</h3>
    <label><input type="checkbox" id="links" checked><span>Constellation links<small>particles near the cursor link up</small></span></label>
    <label><input type="checkbox" id="ripple" checked><span>Click shockwave<small>click to send a ripple through the field</small></span></label>
  </div>
  <div class="group" style="margin:0"><h3>Signature</h3>
    <label><input type="checkbox" id="sig" checked><span>Initials emerge when idle<small>hold the cursor still ~2s</small></span></label>
    <label><input type="checkbox" id="hide"><span>Hide hero text<small>to see the field alone</small></span></label>
  </div>
</aside>

<script>
const c = document.getElementById('c'), x = c.getContext('2d');
const dpr = Math.min(devicePixelRatio || 1, 2);
const palettes = {
  ember:    { bg:[11,13,16],  line:'232,230,227', hi:'255,79,109', fg:'#e8e6e3', muted:'#8a8f98', accent:'#ff4f6d' },
  abyss:    { bg:[6,10,24],   line:'80,200,190',  hi:'190,120,255', fg:'#dff7f3', muted:'#6f8fa0', accent:'#7ef0dc' },
  spectral: { bg:[10,10,14],  line:null,          hi:'255,255,255', fg:'#f0f0f0', muted:'#8a8a99', accent:'#ffb86b' },
  ink:      { bg:[244,241,234], line:'30,30,36',  hi:'200,40,60',   fg:'#1d1d22', muted:'#6b6860', accent:'#c8283c' },
};
let pal = palettes.ember, cursorMode = 'repel';
let W, H, mouse = { x:-9999, y:-9999 }, lastMove = performance.now(), pts = [], ripples = [], mask = null, t0 = performance.now();
const $ = id => document.getElementById(id);

function applyPalette() {
  const r = document.documentElement.style;
  r.setProperty('--bg', `rgb(${pal.bg})`); r.setProperty('--fg', pal.fg); r.setProperty('--muted', pal.muted); r.setProperty('--accent', pal.accent);
  x.fillStyle = `rgb(${pal.bg})`; x.fillRect(0, 0, W, H);
}

function buildMask() {
  const m = document.createElement('canvas'); m.width = W; m.height = H;
  const mx = m.getContext('2d');
  const size = Math.min(W * .42, H * .62);
  mx.font = `700 ${size}px Inter, sans-serif`; mx.textAlign = 'center'; mx.textBaseline = 'middle';
  mx.fillText('SK', W * .68, H * .52);
  mask = mx.getImageData(0, 0, W, H).data;
}
const inMask = (px, py) => mask && px >= 0 && py >= 0 && px < W && py < H && mask[((py | 0) * W + (px | 0)) * 4 + 3] > 128;

function resize() {
  W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.round(W * H / 1100);
  pts = Array.from({ length: n }, () => spawn({}));
  buildMask(); applyPalette();
}
function spawn(p) { p.x = Math.random() * W; p.y = Math.random() * H; p.life = 80 + Math.random() * 220; p.kick = 0; return p; }

addEventListener('resize', resize);
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; lastMove = performance.now(); });
addEventListener('mouseleave', () => { mouse.x = mouse.y = -9999; });
c.addEventListener('click', e => { if ($('ripple').checked) ripples.push({ x:e.clientX, y:e.clientY, r:0 }); });

// smooth noise
const P = new Uint8Array(512); { const p = [...Array(256).keys()].sort(() => Math.random() - .5); for (let i = 0; i < 512; i++) P[i] = p[i & 255]; }
const fade = t => t*t*t*(t*(t*6-15)+10), lerp = (a,b,t) => a+t*(b-a), grad = (h,x,y) => ((h&1)?-x:x)+((h&2)?-y:y);
function noise(a, b) { const X=Math.floor(a)&255, Y=Math.floor(b)&255; a-=Math.floor(a); b-=Math.floor(b); const u=fade(a), v=fade(b), A=P[X]+Y, B=P[X+1]+Y;
  return lerp(lerp(grad(P[A],a,b),grad(P[B],a-1,b),u),lerp(grad(P[A+1],a,b-1),grad(P[B+1],a-1,b-1),u),v); }

let sigStrength = 0;
function frame(now) {
  const t = now - t0, idle = now - lastMove;
  const ink = pal === palettes.ink;
  x.fillStyle = `rgba(${pal.bg},${ink ? .035 : .05})`; x.fillRect(0, 0, W, H);

  const wantSig = $('sig').checked && idle > 2000;
  sigStrength += ((wantSig ? 1 : 0) - sigStrength) * .02;

  for (const r of ripples) r.r += 7;
  ripples = ripples.filter(r => r.r < Math.hypot(W, H));

  const z = t * .00005, R = 170, near = [];
  x.lineWidth = 1;
  for (const p of pts) {
    let a = noise(p.x * .0025 + z, p.y * .0025 - z) * Math.PI * 3, speed = 1.4;
    const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
    let heat = 0;
    if (d < R) {
      const k = 1 - d / R; heat = k;
      const away = Math.atan2(dy, dx);
      if (cursorMode === 'repel') a += away * k;
      else if (cursorMode === 'vortex') a = lerp(a, away + Math.PI / 2, k);
      else a = lerp(a, away + Math.PI, k * .8);
      if (near.length < 60) near.push(p);
    }
    for (const r of ripples) {
      const rd = Math.abs(Math.hypot(p.x - r.x, p.y - r.y) - r.r);
      if (rd < 24) { p.kick = Math.max(p.kick, 1 - rd / 24); p.ka = Math.atan2(p.y - r.y, p.x - r.x); }
    }
    let nx = p.x + Math.cos(a) * speed, ny = p.y + Math.sin(a) * speed;
    if (p.kick > .01) { nx += Math.cos(p.ka) * p.kick * 6; ny += Math.sin(p.ka) * p.kick * 6; heat = Math.max(heat, p.kick); p.kick *= .92; }

    const inside = sigStrength > .02 && inMask(p.x, p.y);
    if (inside) { nx = lerp(nx, p.x, sigStrength * .85); ny = lerp(ny, p.y, sigStrength * .85); heat = Math.max(heat, sigStrength * .9); }

    let col;
    if (pal.line === null) { const hue = ((a * 57.3) % 360 + 360) % 360; col = `hsla(${hue},80%,${60 + heat * 20}%,${.25 + heat * .5})`; }
    else col = heat > .05 ? `rgba(${pal.hi},${.35 + heat * .55})` : `rgba(${pal.line},${ink ? .22 : .28})`;
    x.strokeStyle = col; x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(nx, ny); x.stroke();

    p.x = nx; p.y = ny; p.life -= inside ? .2 : 1;
    if (p.life < 0 || p.x < 0 || p.x > W || p.y < 0 || p.y > H) spawn(p);
  }

  if ($('links').checked && near.length) {
    for (let i = 0; i < near.length; i++) for (let j = i + 1; j < near.length; j++) {
      const a = near[i], b = near[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 55) { x.strokeStyle = `rgba(${pal.hi},${(1 - d / 55) * .35})`; x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke(); }
    }
  }
  requestAnimationFrame(frame);
}

$('pal').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  [...$('pal').children].forEach(n => n.classList.toggle('on', n === b)); pal = palettes[b.dataset.p]; applyPalette(); });
$('cur').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  [...$('cur').children].forEach(n => n.classList.toggle('on', n === b)); cursorMode = b.dataset.c; });
$('hide').addEventListener('change', e => document.body.classList.toggle('hidetext', e.target.checked));

resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
