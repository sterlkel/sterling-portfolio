<!doctype html>
<html lang="en" data-demo="paper" data-default-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sterling Kelly · Paper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=JetBrains+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
<script src="../shared/theme.js"></script>
</head>
<body>
<header id="nav"></header>

<section class="hero fade" id="top">
  <canvas class="flow" id="flow"></canvas>
  <div class="inner">
    <h1>Sterling Kelly, <em>engineer &amp; writer.</em></h1>
    <p class="sub">I build software for a living and write about what I learn, plus the occasional thing that has nothing to do with code.</p>
    <div class="cta"><a class="btn" href="blog.html">Read the blog</a><a class="btn ghost" href="work.html">See my work</a></div>
  </div>
</section>

<main class="wrap" style="padding-bottom:96px">
  <div id="idx"></div>
</main>

<footer id="foot"></footer>

<script src="../shared/data.js"></script>
<script src="../shared/flow.js"></script>
<script src="../shared/components.js"></script>
<script>
const $ = id => document.getElementById(id);
UI.nav($('nav'), { links: [['Writing', 'blog.html'], ['Work', 'work.html'], ['About', 'about.html'], ['Resume', 'resume.html'], ['Contact', 'contact.html']] });
new FlowField($('flow'), { signature: true, sigX: .8, shockwave: true, clickTarget: $('top') });
UI.sectionIndex($('idx'));
UI.footer($('foot'));
UI.reveal();
</script>
</body>
</html>
