<!doctype html>
<html lang="en" data-demo="margin" data-default-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sterling Kelly · Margin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=JetBrains+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Fraunces:opsz,wght@9..144,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
<script src="../shared/theme.js"></script>
</head>
<body>
<header id="nav"></header>

<main>
  <section class="wrap intro">
    <img class="ava" id="ava" alt="">
    <div>
      <h1>Hi, I'm Sterling. I'm a software engineer who builds <span class="ul">small, useful tools</span> and writes about them.</h1>
      <p>One-time founder, published novelist. <a href="about.html">More about me →</a></p>
    </div>
  </section>

  <div id="strip"></div>

  <section class="wrap two">
    <div>
      <div class="col-head"><h2>Latest writing</h2><a href="blog.html">all posts →</a></div>
      <div id="latest"></div>
    </div>
    <div>
      <div class="col-head"><h2>Selected work</h2><a href="work.html">all work →</a></div>
      <div id="sel"></div>
    </div>
  </section>

  <section class="wrap" style="padding-bottom:96px">
    <div id="c1"></div>
    <div id="els" style="margin-top:28px"></div>
  </section>
</main>

<footer id="foot"></footer>

<script src="../shared/data.js"></script>
<script src="../shared/flow.js"></script>
<script src="../shared/components.js"></script>
<script>
const $ = id => document.getElementById(id);
UI.nav($('nav'), { links: [['Writing', 'blog.html'], ['Work', 'work.html'], ['About', 'about.html'], ['Resume', 'resume.html'], ['Contact', 'contact.html']] });
$('ava').src = SK.person.photo;
$('strip').innerHTML = UI.flowStrip();
$('c1').innerHTML = UI.chapter('→', 'Elsewhere on the site');
UI.writingList($('latest'), { limit: 3, excerpts: true });
UI.workRows($('sel'), { limit: 3 });
UI.elsewhere($('els'), { items: [
  ['about', "Who's writing this", 'Short bio, experience, and the keyboard of tools I use.', 'about.html'],
  ['résumé', 'The formal version', 'The same PDF I send to recruiters.', 'resume.html'],
  ['contact', 'Say hello', 'Email, or book 20 minutes.', 'contact.html'],
  ['card', 'My card', 'Save my contact in one tap.', 'card.html'],
] });
UI.initDividers();
UI.footer($('foot'));
UI.reveal();
</script>
</body>
</html>
